[[changes]]
category = "feature"
subsystem = "renderer"
title = "Big particle emitters can collide on the GPU, landing on what the camera sees"
details = "A ParticleEmitter with Collides on that gives off thousands of particles now moves them on the GPU instead of staying on the CPU, landing them on the surfaces the camera sees (the depth prepass) with the same Bounce and LifetimeLoss. Surfaces off screen or hidden don't stop them there; smaller colliding emitters still land on physics surfaces on the CPU, and emitters with sub-emitters stay on the CPU."
features = ["renderer.particles"]
prs = [312]

[[changes]]
category = "feature"
subsystem = "renderer"
title = "Light probes baked inside walls or the ground no longer leak light into rooms"
details = "Bake Probes now marks each light probe that stands inside a colliding part or under the terrain's ground as invalid. Surfaces leave those probes out and blend the ones around them instead, so a bright probe stuck in a wall no longer lights the next room. The Light Probes overlay shows them as magenta crosses and counts them. Bake again to get this; older bakes light as before."
features = ["renderer.global-illumination"]
prs = [301]

[[changes]]
