subsystem = "networking"
title = "Load-test a game server with headless bots"
details = "axcenity-bots <game> --join <address> --count <n> joins that many headless players over real UDP, walking and jumping about, and reports their join times, round trips, bandwidth and how often the server moved them back. axcenity-server --stats prints the server's frame times and players' connections while it serves, and --max-players takes more players than the game's MaxPlayers. scripts/net-scale.py runs both on one or two machines and writes a report (multiplayer readiness MP1)."
stability = "experimental"

[[changes]]
category = "feature"
subsystem = "networking"
title = "Servers stop players' characters going through walls or flying"
details = "A dedicated server or host now refuses a joined player's character move that passes through (or ends inside) an anchored solid part or Terrain, or keeps it off the ground longer and higher than a jump allows, and an owned part moved faster than 400 studs a second; the device is moved back. A device that keeps making such moves is flagged and kicked like one over its budgets. axcenity-bots --cheat speed|noclip|fly runs modified clients to check it (multiplayer readiness MP3b)."
stability = "experimental"

[[changes]]
category = "feature"
subsystem = "networking"
title = "Players rejoin by themselves after losing the connection"
details = "A player who joined a game over the network and loses the connection (the server crashed or restarted, or the network dropped) keeps playing what they see and tries to rejoin for a minute before ConnectionFailed fires. A server that hasn't noticed the old connection is gone lets them back in place of it, even when the game is full, with the same name. axcenity-bots gains --churn and --flood for operational tests, the server's --stats lines show its Instance count and Lua memory, and renetcode's error for every unreadable packet no longer floods the log (multiplayer readiness MP2)."
stability = "experimental"

[[changes]]
category = "feature"
subsystem = "networking"
title = "Servers hold each player to what a game client sends, and kick cheaters"
details = "Each player's device has a budget for bytes, remote calls, chat, console commands, streaming requests and motion packets; what goes over it, can't be read or only the server sends is dropped, and the player is flagged. Scripts hear Players.PlayerFlagged(player, reason), and a player flagged 5 times in a minute is kicked with the reason (axcenity-server --kick-flags changes it, 0 never). A device spamming junk as fast as it can is kicked in about 3 seconds (multiplayer readiness MP3)."
stability = "experimental"

[[changes]]
category = "breaking"
subsystem = "networking"
title = "Network protocol 13: games and Collaborate sessions on this version can't join older ones"
details = "The new DataLayerService (roadmap R16.2) is made with every world, after the other services, so the Instances after it are numbered differently than on older versions. DataLayer also has a new Active property (R16.4), so class defaults differ too. A player or Collaborate member on an older version is told to update when they join."
prs = [328]

[[changes]]
category = "breaking"
subsystem = "networking"
title = "Network protocol 14: players on this version can't join games on older ones"
details = "The join request and the server's welcome carry a rejoin key (multiplayer readiness MP2), so a player on an older version is told to update when they join."

[[changes]]
category = "breaking"
subsystem = "networking"
title = "Network protocol 16: players on this version can't join games on older ones"
details = "Players gains CharacterAuthority, and devices and servers exchange moves and their answers for server-moved characters (multiplayer readiness MP6a), so a player on an older version is told to update when they join."

[[changes]]
category = "feature"
subsystem = "assets"
title = "Import OBJ models with their materials"
details = "Wavefront .obj files can be imported like glTF and FBX ones, by Import… or by dropping them on the editor. The .mtl library next to the file gives them their colors and textures; each o object can be picked in the Import dialog. OBJ is taken as Y up, 1 unit = 1 stud."
features = ["assets.model-import"]
prs = [351]

[[changes]]
category = "fix"
subsystem = "gameplay"
title = "Characters spawned with no SpawnLocation no longer stand inside each other"
details = "In a game with no SpawnLocation, every character stood at the origin, so two players' characters pushed each other apart and one could fall through the floor. Characters now spread out around the origin as they do on a SpawnLocation."
stability = "experimental"

[[changes]]
category = "feature"
subsystem = "renderer"
title = "Particles can come out in timed bursts, keep their part's speed and head out from (or into) round shapes"
details = "A ParticleEmitter's new Bursts (a NumberSequence of times and counts) gives off bursts over a loop of Duration seconds, VelocityInheritance adds a share of the moving part's velocity to new particles, and ShapeInOut (Outward, Inward, InAndOut) picks which way they head. Sphere, Cylinder and Disc shapes now send particles away from their middle instead of along Direction; a Box still heads along Direction. CPU and GPU particles behave the same."
features = ["renderer.particles"]
prs = [302]

[[changes]]
category = "feature"
subsystem = "renderer"
title = "Particles can land on floors and bounce, and emitters can burst where other particles die or land"
details = "A ParticleEmitter's new Collides makes its particles land on parts with CanCollide on and the ground, keeping Bounce of their speed into the surface and losing LifetimeLoss of their life each landing. A ParticleEmitter inside another with EmitOn set to Birth, Death or Collision becomes a sub-emitter, giving off EmitCount particles where each of its parent's particles is born, dies or lands: sparks that splash on the ground, fireworks that burst at the end of their trail. Such emitters move their particles on the CPU, up to 4,000 each; existing emitters are unchanged."
features = ["renderer.particles"]
prs = [311]

[[changes]]
category = "feature"
subsystem = "renderer"
title = "Particles can change size, color and transparency along curves over their lives"
details = "A ParticleEmitter's new SizeOverLife, TransparencyOverLife and ColorOverLife take a NumberSequence or ColorSequence (keypoints from birth to death, with an envelope for a per-particle spread), edited in Properties as a curve or gradient and from scripts with NumberSequence.new and ColorSequence.new. Unset, Size/SizeEnd and the other pairs work as before."
features = ["renderer.particles"]
prs = [284]

[[changes]]
category = "feature"
subsystem = "renderer"
title = "Particles can play a flipbook: a texture cut into frames, shown one at a time"
details = "A ParticleEmitter's new FlipbookLayout (Grid2x2, Grid4x4, Grid8x8) cuts its Texture into frames, FlipbookMode picks each particle's frame as it ages (Loop, OneShot over its life, PingPong or Random), FlipbookFramerate sets the frames a second and FlipbookStartRandom starts each particle on a frame of its own. Smoke, fire and explosion sheets animate on CPU and GPU particles alike. FlipbookLayout None (the default) shows the whole texture as before."
features = ["renderer.particles"]
prs = [306]

[[changes]]
category = "feature"
subsystem = "renderer"
title = "Particles can be born in a sphere, cylinder or disc, or only on its surface, and change speed over their lives"
details = "A ParticleEmitter's new Shape (Box, Sphere, Cylinder, Disc) and ShapeStyle (Volume, Surface) pick where in its part particles start, stretched to the part's size, and SpeedOverLife (a NumberSequence) scales their speed as they age. The defaults give off from anywhere in the part at a steady speed, as before. CPU and GPU particles follow the same shapes and curve."
features = ["renderer.particles"]
prs = [292]

[[changes]]
category = "feature"
subsystem = "renderer"
title = "Path Traced view mode"
details = "Viewport > View Mode > Path Traced shows a reference picture of the scene made by path tracing: rays bounce through the hardware ray traced scene, one more path a pixel each frame, picking up the sun, every lamp (each with its own shadow ray), glowing surfaces and the sky. The picture clears up while the camera and scene stay still and starts again when anything changes; its legend counts the paths so far. Surfaces are treated as matte, and glass, water and fog are left out. Needs a GPU that can ray trace."
stability = "experimental"

[[changes]]
category = "feature"
subsystem = "networking"
title = "Shots at moving targets count where the shooter saw them"
details = "A server's workspace:Raycast with RaycastParams.CompensateFor = player, or in a RemoteEvent handler inside a Tool with LagCompensated on, tests moving parts where that player saw them: their round trip plus the 0.1 s smoothing delay, at most 1 second back."
features = ["networking.lag-compensation"]
commits = ["db1ffa77"]

[[changes]]
category = "breaking"
subsystem = "networking"
title = "Network protocol 12: games on this version can't play with older ones"
details = "Tools have a LagCompensated property (unified plan Phase 81), so a server sends it to players' devices. A player on an older version is told to update when they join."

[[changes]]
category = "feature"
subsystem = "networking"
title = "Record games as replays, watch them back and show kill cams"
details = "ReplayService:StartRecording() and StopRecording(name) save a .replay in the player's data folder; axcenity-player --replay <file> <game> plays it with pause, speed, jumps, a timeline and a camera that follows any player. BufferSeconds and PlayBuffer(player) show the last seconds through a player's eyes."
features = ["networking.replays"]
commits = ["0d61d0b7"]

[[changes]]
category = "breaking"
subsystem = "scripting"
title = "animation:Play(), Stop(), Pause() and Resume() are now errors that name the fix"
details = """These Animation methods were kept from before AnimationTracks. Each now raises an error such as "animation:Play() was removed: use local track = animator:LoadAnimation(animation), then track:Play()". Play the Animation through its Animator instead (pause with track:AdjustSpeed(0)). AutoPlay still works, and the UI Designer's Play on click writes the LoadAnimation form."""
prs = [223]

[[changes]]
category = "breaking"
subsystem = "project"
title = "Projects move to format 6, and the oldest clip and block-script shapes are upgraded once on open"
details = "Opening a project upgrades it to format 6 and keeps a copy of the previous files in .axcenity/previous/5, as earlier upgrades did. Clips and state machines still in animation format 1, and block-script conditions saved in the first block format, are rewritten in the current shape; the engine no longer reads the old shapes anywhere else. An older Axcenity can't open a format 6 project. The Starter scene template is gone from New Project (the genre templates replace it); projects made from it open as before."
prs = [223]

[[changes]]
category = "fix"
subsystem = "editor"
title = "Bake Probes no longer freezes the editor: it bakes in the background with progress and Cancel"
details = "Baking light probe volumes and reflection probes used to run all at once, so a project with many probes locked the editor until it finished, with no sign of what was happening. The bake now runs a little each frame: a Baking Probes window shows what's being baked, how many probes are done and about how long is left, and Cancel keeps the volumes already finished. Bakes of 1,000 or more light probes say in Output that they can take minutes, and the scene is uploaded once for all volumes instead of once per volume."
features = ["renderer.global-illumination"]
prs = [297]

[[changes]]
category = "feature"
subsystem = "terrain"
title = "Procedural buildings: a street of houses from a few settings"
details = "Insert > Building makes a building from a footprint: its own box, which the Move, Rotate and Scale handles change, or the corners of a Spline. It stacks Floors of walls with windows and a front door under a flat or gable roof, varied by Seed, from built-in parts or your own wall, window, door and corner models. Change a setting and it's built again; Bake keeps it as ordinary parts. The Hello Buildings example is a street of them."
features = ["terrain.studio"]

[[changes]]
category = "fix"
subsystem = "renderer"
title = "No more black blotches under leaves with ray traced shadows"
details = "Ray traced shadows and ambient occlusion traced cut-out leaves and grass as solid cards, so leaves lying on the ground shaded it in black, card-shaped patches that flickered. A cut-out right on a surface is no longer counted; farther ones still cast shadows."

[[changes]]
category = "fix"
subsystem = "renderer"
title = "Soft ray traced shadows on slopes no longer look dithered"
details = "The smoothing of soft ray traced shadows left out pixels of a surface seen side-on, so a shadow's soft edge on a slope showed the rays' per-pixel pattern as a dither. It now compares neighbours by the surface's plane."

[[changes]]
category = "fix"
subsystem = "renderer"
title = "Ray traced ambient occlusion and GI see through cut-outs' holes"
details = "Ray traced ambient occlusion and ray traced global illumination now let rays through the cut-out parts of leaves, grilles and fences, as ray traced shadows already did, instead of treating every cut-out as a solid card. Foliage no longer darkens the ground around it in card-shaped patches, and light bounces through gaps between leaves."
stability = "experimental"

[[changes]]
category = "feature"
subsystem = "renderer"
title = "Ray traced light shafts in volumetric fog"
details = "With volumetric fog and ray traced shadows both on, the sunlight in the fog near the camera is traced by rays instead of read from the shadow maps, so shafts through windows, between leaves and through gaps are sharp, have no shadow-map leaks and show even with shadow quality Off. Glass lets the light through. Past the ray tracing distance the shadow maps take over smoothly."
stability = "experimental"

[[changes]]
category = "feature"
subsystem = "renderer"
title = "Ray traced shadows for point, spot and rect lights"
details = "With Settings > Graphics > Ray traced shadows on, every PointLight, SpotLight and RectLight with Shadows on near the camera casts ray traced shadows, not only the few the shadow maps allowed. Soft shadows follow Lighting's ShadowSoftness: a lamp's shadow softens with its bulb size, and a RectLight's is traced over its whole rectangle. A lamp's own fixture doesn't shade it. Lights inserted in the editor now have Shadows on; turn it on for existing lamps."
stability = "experimental"

[[changes]]
category = "improvement"
subsystem = "editor"
title = "One click for the ray traced look, and a Learn guide to ray tracing"
details = "Settings > Graphics > Ray tracing has Use the ray traced look, which turns on Hardware ray tracing, ray traced shadows and ambient occlusion and the settings they look best with, keeping the rest, and Ray traced effects off. When a restart is still needed it says so, and to check a Desktop shortcut opens this version. A new Learn page, Ray tracing: the best look, simply, explains turning it on, reading the viewport badge, and getting good shadows and sky."

[[changes]]
category = "feature"
subsystem = "renderer"
title = "Ray traced water reflections"
details = "With hardware ray tracing on, water at High and Ultra reflection quality traces a ray where its screen-space reflection finds nothing, so parts above or behind the view, or hidden on screen, show in the water. What a ray finds is lit by the sun (with its shadow), nearby lamps, the ambient light and the light probes."
stability = "experimental"

[[changes]]
category = "improvement"
subsystem = "editor"
title = "Compare: see the view with and without ray tracing"
details = "The Scene view's ray tracing badge has a Compare toggle that draws the view without its ray traced effects, and back, without a restart or a settings change. The Learn guide says what to look for."

[[changes]]
category = "fix"
subsystem = "editor"
title = "Ray tracing says when AXCENITY_RAY_TRACING=0 keeps it off"
details = "When the editor was started with AXCENITY_RAY_TRACING=0 (for example left set in a PowerShell window after a test), ray tracing stayed off however often it restarted, and the badge only said to restart. The badge and Settings > Graphics now name the variable, and Restart now starts the editor without it."

[[changes]]
category = "feature"
subsystem = "networking"
title = "Players can join a game hosted behind a home router with a join code"
details = "Run axcenity-relay on a computer with a public address (TCP and UDP port 47810) and host with --relay address:port: the host gets a six-letter join code and a link. Players join with --join CODE --relay address:port, or the link; they connect directly when a hole can be punched through both routers, and through the relay otherwise. The relay can't read the game or the password. Axcenity runs no public relay (multiplayer readiness MP5a)."
stability = "experimental"

[[changes]]
category = "fix"
subsystem = "networking"
title = "A remote message of deeply nested tables no longer crashes a server"
details = "A modified client could send a RemoteEvent message whose argument was tables nested 200,000 deep (600 KB), and the server, or any device that read it, overflowed its stack and stopped. Reading now stops at 32 tables deep and drops the message, and a script that sends tables nested deeper than that gets an error (multiplayer readiness MP3)."

[[changes]]
category = "improvement"
subsystem = "editor"
title = "Restart now, for Hardware ray tracing"
details = "When Hardware ray tracing needs a restart, Settings > Graphics > Ray tracing and the Scene view's ray tracing badge have a Restart now button. It starts the editor again with the same project, keeping unsaved world and script edits, so ray tracing turns on without closing and reopening anything by hand."

[[changes]]
category = "feature"
subsystem = "networking"
title = "Hosts ask the home router to forward the game's port"
details = "A secured host (axcenity-server, or axcenity-player --host without --lan) asks its router to forward the game's port from the internet over UPnP, PCP or NAT-PMP, and logs the router's outside address with a join link players on other networks can use. The mapping is renewed while the game is hosted and removed when hosting stops. Routers with these turned off, and internet providers that put their own router in front (carrier-grade NAT, which the log warns about), still need a forwarded port or a relay. --no-port-map turns it off (multiplayer readiness MP5b)."
stability = "experimental"

[[changes]]
category = "feature"
subsystem = "renderer"
title = "Ray traced sun shadows (optional)"
details = "With Hardware ray tracing on, Settings > Graphics > Ray tracing > Ray traced shadows (Off, Low, Medium, High) traces the sun's shadows as rays from each pixel within the ray tracing distance: exact up close, soft by how far the caster is (from Lighting's ShadowSoftness), with the shadow maps past the reach and for see-through surfaces. Low, Medium and High trace 1, 2 or 4 rays a pixel for soft shadows. Off at every preset. LocalScripts can set UserGameSettings.RayTracedShadows, and blocks have it under set graphics option. A badge at the bottom right of the editor viewport says whether ray tracing is on, which effects are drawing and how many items rays see."
stability = "experimental"

[[changes]]
category = "feature"
subsystem = "renderer"
title = "Ray traced global illumination (optional)"
details = "On a GPU that can ray trace, Settings > Graphics > Ray traced GI lights light probes with rays each frame, so bounced light follows a moving sun, lamps and moved walls, and rooms get the light their windows let in. The camera brings its own probes, 3 studs apart, so it needs no light probe volume; probes stuck inside walls are left out. Low, Medium and High trace 128, 256 or 512 probes a frame. It's off by default, takes Real-time GI's place while on, and scripts set it through UserGameSettings.RayTracedGlobalIllumination."

[[changes]]
category = "feature"
subsystem = "renderer"
title = "Ray traced ambient occlusion (optional)"
details = "With Hardware ray tracing on, Settings > Graphics > Ray tracing > Ray traced ambient occlusion (Off, Low, Medium, High) darkens corners and creases with short rays (2, 4 or 8 a pixel) instead of guessing from the screen, so things off screen or behind others count too. It draws ambient occlusion even with the screen-space setting off, and fades into it past the ray tracing distance. Off at every preset. LocalScripts can set UserGameSettings.RayTracedAmbientOcclusion, and blocks have it under set graphics option."
stability = "experimental"

[[changes]]
category = "feature"
subsystem = "terrain"
title = "Scatter rules place plants, props and models over a whole terrain by height, slope and material"
details = "Terrain Studio > Scatter Rules adds ScatterRule objects inside a Terrain (the Forest set of three, Forest Trees, Undergrowth, Meadow Flowers, Grass Tufts, or an empty Scatter Rule). Each places what its Models list names, picked from the Assets panel, wherever its spacing, density, height and slope windows, material layer, clumping and distance from earlier rules allow, with random turn and size. The layout follows sculpting and painting as you work, is the same for the same seed on every device, and isn't saved: it's made again when the world loads. Bake turns it into painted foliage you can brush and erase. A 2,048-stud forest of 348,000 plants is placed in about a tenth of a second."
features = ["terrain.studio"]

[[changes]]
category = "feature"
subsystem = "editor"
title = "Model Studio: seven new sculpt brushes and a Mesh Filter"
details = "Sculpt mode adds Layer, Blob, Scrape, Fill, Draw Sharp, Nudge and Elastic Grab brushes, each explained on hover. The new Mesh Filter smooths, sharpens, inflates, scales or roughens the whole object at once, held back by the mask, as one undo step."
prs = [317]

[[changes]]
category = "feature"
subsystem = "editor"
title = "Model Studio saves sculpt masks with the model"
details = "A mask painted in Sculpt mode is kept on its object and saved in the model's sidecar, so it's there again after closing and reopening the model. Painting or clearing a mask leaves the model unsaved, undoing a stroke keeps the mask, and undoing Voxel Remesh or Subdivide brings it back."
features = ["editor.model-studio"]
prs = [322]

[[changes]]
category = "security"
subsystem = "networking"
title = "Games hosted on the network are encrypted, and only players who pass the password get in"
details = "A dedicated server and a player's --host now hand out connect tokens over TLS from TCP on the game's port (47800), checking the game, version and password first, and every packet after is encrypted. Players check the server's certificate against the fingerprint in a join link (axcenity://join/address:port#fingerprint, printed by the host) or the one remembered for that address, and are told if it changed. The certificate is kept in the engine's data folder, never in a project. LAN games stay unsecured: player --host --lan, axcenity-server --insecure (multiplayer readiness MP4)."
stability = "experimental"

[[changes]]
category = "breaking"
subsystem = "networking"
title = "Older Axcenity versions can't join a secured game"
details = "Players on a version from before secure connections can't join a server hosted with this one (their connection requests carry no token and are dropped). Update every player, or host a LAN game with player --host --lan or axcenity-server --insecure. A secured server needs TCP as well as UDP open on its port."

[[changes]]
category = "feature"
subsystem = "networking"
title = "Servers can move players' characters, with prediction on their devices"
details = """Players.CharacterAuthority = "Server" (or axcenity-server --character-authority server) has the server move each player's character from the keys their device sends, so a modified client can't move it anywhere the game wouldn't. The player's own device still moves its character at once and checks it against the server's answers; when they differ it puts the character where the server has it, takes the steps since again and slides the difference away. "Client", the default, keeps today's behavior. Other players' characters, seats and moving platforms can still cost small corrections (multiplayer readiness MP6a)."""
stability = "experimental"

[[changes]]
category = "improvement"
subsystem = "renderer"
title = "A sky picture darkens toward night, and one click makes the sky follow the time of day"
details = "A sky image (Lighting.SkyImage, such as the default sky) now dims with ClockTime as the drawn sky does, so night falls with a picture too; its own colors stay the picture's. Under Lighting's SkyImage row a note says so, with a Follow time of day button that clears the picture and adds an Atmosphere, for a sky that turns orange at sunrise and sunset."

[[changes]]
category = "fix"
subsystem = "networking"
title = "Players who spawn on the same SpawnLocation no longer stand inside each other"
details = "Each character now takes a free spot on the SpawnLocation's top. Before, characters made in the same place pushed each other apart on their devices, and the server moved them back every frame, or they fell through the floor. A character standing still is also never moved back for the network's rounding of its position."

[[changes]]
category = "feature"
subsystem = "editor"
title = "Big worlds can stream while you edit them"
details = "Viewport menu > Overlays > Stream While Editing (also Settings > Viewport): with the Workspace's StreamingEnabled on, the viewport leaves out what's beyond StreamingTargetRadius of the camera while editing, as Play does, so a big world edits as light as it plays. Whatever is selected always shows. Off by default and kept between runs."
prs = [331]

[[changes]]
category = "feature"
subsystem = "editor"
title = "The Streaming overlay shows what streams in around the camera while editing"
details = "With Workspace.StreamingEnabled on, Overlays > Streaming outlines each streaming unit within the unload radius by where it stands from the camera (there at once, loads, or kept if loaded), the parts that are always there and both radii. Its legend counts what a player standing there would have and names any unit too big to stream well."
prs = [280]

[[changes]]
category = "feature"
subsystem = "renderer"
title = "Sun Rays effect: beams of sunlight through leaves and windows (optional)"
details = "Insert > Lighting > Lens > Sun Rays puts a SunRaysEffect in Lighting. While the sun is in or near the view, bright sky showing through gaps in leaves, a window frame or anything else in front of the sun streams into beams. Intensity (0.25) sets how bright they are and Spread (0.5) how far they reach. They're worked out on screen, so they fade as the sun leaves the view, and they need no ray tracing. Settings > Graphics > Sun rays turns them off (off at Low). LocalScripts can set UserGameSettings.SunRays, and blocks have it under set graphics option."
stability = "experimental"

[[changes]]
category = "improvement"
subsystem = "renderer"
title = "With TAA on, a render scale below 100% upscales inside TAA for a sharper picture"
details = "Below 100% render scale with TAA on, TAA gathers the jittered scene samples into an output-sized history and result, so the picture is rebuilt over several frames instead of stretched; only the sharpening pass runs after it. Motion blur and depth of field run before TAA while it upscales. Without TAA, the render scale upscales as before."
features = ["renderer.temporal"]
prs = [277]

[[changes]]
category = "feature"
subsystem = "terrain"
title = "Terrain holes, cliff rocks and walk-in caves"
details = "The Terrain Studio's Holes tool cuts holes in the ground (Shift fills them): you see, walk and fall through them, they save with the terrain, and one stroke is one undo step. Build a cave from parts under a hole in a hillside for a cave mouth you can walk into. New Cliff Rocks and Boulders scatter rules stand rock faces on steep slopes and rocks on gentler ones, and the Alpine world preset adds cliff rocks. The Hello Caves example is a hill with a cave in it."
features = ["terrain.studio"]

[[changes]]
category = "feature"
subsystem = "terrain"
title = "Scatter rules keep off buildings, lean with slopes, and models can be set into the terrain"
details = "Scatter rules no longer place plants inside anchored parts standing on the ground (Avoid Parts, with a Part Margin), and moving a house remakes only the ground near it. Align To Slope leans what a rule places with the hillside and Sink Depth sinks it into the ground, for rocks, grass and tree trunks on slopes. Solid Modeling has Conform to Terrain, which sets the selected parts or models on the ground, and Blend into Terrain, which levels and paints the ground under them, fading into the slope around."
features = ["terrain.studio"]

[[changes]]
category = "feature"
subsystem = "terrain"
title = "Terrain paths: roads that keep plants off, flatten and paint the ground, and route over hills"
details = "Insert > Terrain Path puts a TerrainPath in a Spline. Scatter rules keep off its strip as soon as it's there and wherever its points move. Apply to Terrain flattens the ground under it to the curve and paints a layer, blending in over Falloff, as one undo step. Route lays the Spline's points over the terrain from its first point to its last, never climbing more than Max Grade, so a road winds round or up a hill; also one undo step."
features = ["terrain.studio"]

[[changes]]
category = "feature"
subsystem = "terrain"
title = "Terrain water: seas, lakes and rivers that fill the terrain's hollows"
details = "A Terrain has a Water switch and a WaterLevel: every part of the ground below the level is under water with waves, foam where it meets the ground, what's under seen through it and reflections, the same water as water materials. WaterColor, WaterClarity, WaveHeight, WaveLength, WaveSpeed and WaveDirection set its look. The Terrain Studio has a Water section with a level slider. Water is only drawn for now: nothing swims or floats in it."
features = ["terrain.studio"]

[[changes]]
category = "feature"
subsystem = "editor"
title = "Drag a Toolbox card onto the Assets panel to get it into the project"
details = "A Toolbox result can now be dragged onto the Assets panel as well as the scene. It downloads into the project without being placed, and the Assets panel then shows the new texture set or sound, picked. The panel is outlined while a card is held over it. A sky still asks to be used and a model still opens the Import dialog."
prs = [314]

[[changes]]
category = "feature"
subsystem = "editor"
title = "Listen to Toolbox sounds before getting them"
details = "Each sound in the Toolbox, and its details, has a listen button that plays the source's preview in the editor without downloading the sound into the project. Press it again, listen to another sound or leave the Sounds tab to stop it."
prs = [315]

[[changes]]
category = "feature"
subsystem = "project"
title = "Save a project as a template and start new projects from it"
details = "File > Save as Template… turns the open project into an .axtemplate file (its world, scripts, assets and settings, with a name, description and picture) in the editor's templates folder. New Project lists them under Your templates, and Import… adds a template file someone else made. Projects made from one get their own name and history; a Collaborate project's repository and project ID aren't copied."
features = ["project.user-templates"]
prs = [258]

[[changes]]
category = "fix"
subsystem = "renderer"
title = "A white square no longer flashes in the viewport"
details = "Since hardware ray tracing came in, the GPU was opened with ray tracing whenever it could, and on an RX 9070 XT under DirectX 12 a white square flashed in the editor's viewport now and then. The GPU is now opened with ray tracing only when Settings > Graphics > Ray tracing > Hardware ray tracing is on (off by default; it takes effect at the next start). Bloom also ignores pixels that aren't numbers and caps how much one pixel adds, so one broken pixel can't grow into a square."

[[changes]]
category = "feature"
subsystem = "renderer"
title = "Sun shafts indoors: dusty air in a box, volumetric fog that stays dark in closed rooms, leaf-shaped ray traced shadows"
details = "A FogEffect inside a GraphicsVolume takes Density and Glare: above 0 it fills the volume's box with dust or mist, seen from anywhere, that the sun's shadows carve into shafts through windows and gaps (volumetric fog, Ultra), without thickening the sky or reddening the sun as an Atmosphere does. Volumetric fog now lights the air by the light around it (light probe volumes or ray traced GI), so a closed room's air no longer glows like the open air outside and hides its shafts, and it looks up the sun's shadow at 8 points a cell, so shafts no longer step and crawl. Ray traced shadows pass through cut-outs' holes (leaves cast leaf-shaped shadows instead of solid cards). TAA takes swaying plants' motion into account, so leaves in the wind no longer smear, and Sun Rays' noise averages away under TAA."
stability = "experimental"

[[changes]]
category = "feature"
subsystem = "terrain"
title = "World presets set up a whole landscape at once, and your own can be saved"
details = "The Terrain Studio's Generate tool has World Presets: Temperate Forest, Alpine, Desert, Tropical Island, Tundra and Meadow. Generate with it previews the landscape, and Apply puts in its shape, material layers, biomes, scatter rules and water as one undo step; Only its materials and rules keeps the terrain's shape. Save as preset writes the terrain's setup to the project's presets folder as an .axworld file, listed with the built-in ones; heights scale to the terrain it's used on."
features = ["terrain.studio"]
