[[changes]]
category = "feature"
subsystem = "physics"
title = "Models can carry their own collision shapes, and MeshParts can choose what they collide as"
details = "An object in a model named like another with _COL on the end (Rock_COL, Rock_COL2 and so on) is now one convex piece of that object's collision: it isn't drawn and doesn't change the model's size, the same idea as Unreal's UCX_ and Godot's -colonly objects, so they can be made in Blender. MeshParts gain CollisionFidelity: Default (the model's pieces when it has any, otherwise its hull, which is what every MeshPart did before), Box, Hull or PreciseConvexDecomposition, so a doorway or an arch can be walked through. The Collisions overlay draws the pieces."
features = ["physics.rigid-bodies", "assets.model-import"]
prs = [319]

[[changes]]
category = "feature"
subsystem = "editor"
title = "Data layers: hide or lock a tagged set of objects while you build"
details = "A new Layers panel (View > Panels > Layers) gathers everything tagged with a layer's name into a data layer, wherever it is in the Explorer. Hide a layer to keep it out of the viewport, or lock it so clicks go through it, without changing the world: which layers you hide is kept on your computer and Play still shows them all. Layers are DataLayer objects in the new DataLayerService, saved with the world; making, renaming and deleting one are undo steps."
prs = [328]

[[changes]]
category = "feature"
subsystem = "scripting"
title = "Switch data layers on and off while a game runs"
details = "DataLayerService:SetLayerActive(name, active) sets a layer's objects aside and puts them back where they were, in the same order. A layer whose Active On Start is off starts set aside. IsLayerActive reads a layer, and LayerChanged fires on the server and on every player's device, where the parts leave and come back. Levels set aside their own members of a switched-off layer, and save slots and checkpoints keep each layer's state. Blocks: set layer active, layer is active and when layer changes."
prs = [336]

[[changes]]
category = "feature"
subsystem = "gameplay"
