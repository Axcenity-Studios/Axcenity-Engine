version = "0.3.0-alpha.1"
date = "2026-11-21"
title = "Character Studio, ray tracing, living terrain and secure multiplayer"
summary = """
A Development build following 0.2.0-alpha.1: a stylized default humanoid
with faces, expressions and lip sync, and Character Studio to edit it;
optional ray traced shadows, reflections, GI and a Path Traced view; biomes,
scatter rules, paths, water and caves for terrain; richer particles and
fog volumes; servers that validate movement, lag compensation, replays and
join codes; USD and OBJ import, Edit in Blender, AutoRecover and build
profiles. Projects opened in it are upgraded to project format 6 after
asking, older engines can't open them again, and it can't play online with
older versions (network protocol 16).
"""
evidence = "verified"
published = true

[verification]
linux = "scripts/check-platform.sh and check-packages.py --profile release on 6bb0ae49 plus the release prep (Fedora 45 desktop): build, player without editor code, clippy, every test, doc tests, game test, headless server, tar.gz/deb/rpm/pkg.tar.zst/AppImage, Build Game for Linux and the built game drawing frames all pass. axcenity-updater end-to-end update and roll back pass. Fixed before the tag: two release tests shared a scratch folder under cargo test."
windows = "Not run for this release: Windows is checked by the release workflow's build and package jobs only."

[formats]
axgame = 2
network_protocol = 16
project = 6
save = 2
world = 2

[[changes]]
category = "fix"
subsystem = "editor"
title = "Some tooltips and messages no longer show a long gap in the middle of a sentence"
details = "The Developer Console tooltip, the sky picker's hover, the volumetric fog notice, an FBX import note and several Team Create messages had a run of spaces where a line break in the source was lost."
prs = [195]

[[changes]]
category = "feature"
subsystem = "scripting"
title = "Script tabs type-check out of the box: the editor ships the Luau language server"
details = "Every package now includes luau-lsp 1.70.1 in a tools folder beside the editor, so type errors and lints are underlined in script tabs as you type without installing anything. An editor built from source offers to download the same version (checked against its pinned SHA-256) from a bar above a script tab or Settings > External tools. AXCENITY_LUAU_LSP still names another one."
features = ["scripting.scripts"]
prs = [348]

[[changes]]
category = "improvement"
subsystem = "scripting"
title = "Type checking follows require into your ModuleScripts"
details = "Script tabs are now checked against the whole project: require(game.ReplicatedStorage.Utils) (or through GetService) brings in the module's functions and types, so calling one that doesn't exist or passing the wrong type is underlined in the script that requires it. Editing a module, even before saving it, checks the scripts open beside it again."
features = ["scripting.scripts"]
prs = [352]

[[changes]]
category = "improvement"
subsystem = "scripting"
title = "Breakpoints and stepping work inside your own coroutines"
details = "A breakpoint inside coroutine.wrap or coroutine.resume now pauses there instead of being skipped. The call stack shows the coroutine's functions and then the ones that resumed it, Step Into goes into a coroutine you resume and stepping past its yield comes back out, and a new Waiting coroutines list shows your other suspended coroutines with where each waits and its locals."
features = ["editor.script-editor"]
prs = [356]

[[changes]]
category = "feature"
subsystem = "assets"
title = "Import USD files (.usd, .usda, .usdc, .usdz)"
details = "USD scenes, including Apple's .usdz, can be imported with Import… or by dropping them on the editor. They're converted to a .glb first, with their units, up axis, object tree and UsdPreviewSurface materials and textures, so the project and games only ever hold glTF. Anything the conversion leaves out is listed in Output. Skeletons and animation aren't brought in yet."
features = ["assets.model-import"]
prs = [362]

[[changes]]
category = "feature"
subsystem = "scripting"
title = "The Profiler shows which script handlers and functions are slow"
details = "The Profiler has a new Scripts tab. Press Record and play: every event handler (Door.Touched, RunService.Heartbeat), script and task.spawn is listed by the time it took, with its share of all script time and its time per call, and every script function by the time spent in it and the functions it calls, with its busiest line. The costliest come first, and clicking one opens the script there."
features = ["editor.script-editor"]
prs = [363]

[[changes]]
category = "feature"
subsystem = "assets"
title = "Animations in glTF and GLB files play as takes, like FBX animation stacks"
details = "Each animation in a .gltf or .glb file (Blender's export, for one) is a take: a clip can link it, state machines play it, and it retargets onto other skeletons by its own skeleton."
features = ["assets.model-import", "animation.clips"]
prs = [368]

[[changes]]
category = "feature"
subsystem = "scripting"
